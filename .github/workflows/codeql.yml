
name: CodeQL - CWE22

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
          queries: security-extended

      - name: Build problematican projekat
        run: dotnet build ./Problematican/PathTraversal-p.csproj --no-incremental

      - name: Build ispravan projekat
        run: dotnet build ./Ispravan/PathTraversal-Ispravan.csproj --no-incremental

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
